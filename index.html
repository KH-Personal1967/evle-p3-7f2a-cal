<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Prevent search indexing -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />

  <title>EVLE Phase 3 — Production Calendar</title>

  <link rel="icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <script defer src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{min-height:100%;height:auto}
    body{font-family:'IBM Plex Sans','Segoe UI',sans-serif;font-size:14px;overflow:auto}
    button{font-family:inherit;cursor:pointer;transition:opacity .15s;font-size:inherit}
    button:hover{opacity:.82}
    input,select{font-family:inherit;font-size:inherit}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:4px}
    ::-webkit-scrollbar-track{background:transparent}
    @media print{
      .noprint{display:none!important}
      html,body,#root{height:auto!important;overflow:visible!important}
      body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
    #bootError{display:none;margin:16px;padding:14px 16px;border:1px solid #ef4444;border-radius:8px;background:#fff1f2;color:#7f1d1d;line-height:1.35}
    #bootError code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:rgba(127,29,29,.08);padding:1px 6px;border-radius:4px}
  </style>
</head>
<body>
  <div id="bootError">
    <strong>Calendar failed to load.</strong><br/>
    Scripts may be blocked. Confirm <code>React</code>, <code>ReactDOM</code>, and <code>Babel</code> load successfully.
  </div>

  <div id="root"></div>

  <!-- Your app -->
  <script type="text/babel" src="./app.jsx"></script>

  <script>
    window.addEventListener("load", () => {
      const ok = (typeof React !== "undefined") && (typeof ReactDOM !== "undefined") && (typeof Babel !== "undefined");
      if (!ok) document.getElementById("bootError").style.display = "block";
    });
  </script>
</body>
</html>
