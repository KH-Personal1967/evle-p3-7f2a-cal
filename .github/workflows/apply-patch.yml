name: Apply Patch File
on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: 'Paste the entire content of your .patch file here'
        type: text
        required: true

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Patch
        env:
          PATCH_DATA: ${{ github.event.inputs.patch_content }}
        run: |
          # Use a python inline script to safely dump multi-line text and clean up whitespace
          python3 -c '
          import os
          data = os.environ.get("PATCH_DATA", "")
          
          # Replace web non-breaking space characters with standard ASCII spaces
          data = data.replace("\u00a0", " ")
          
          with open("temp.patch", "w", encoding="utf-8") as f:
              f.write(data)
          '
          
          # Apply the patch file
          git apply temp.patch
          
          # Clean up temporary file
          rm temp.patch

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply patch via GitHub Actions Web Interface"
          git push
