name: Apply Patch File
on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: 'Paste the entire content of your .patch file here'
        required: true

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Patch
        env:
          PATCH_DATA: ${{ github.event.inputs.patch_content }}
        run: |
          cat << 'EOF' > temp.patch
          $PATCH_DATA
          EOF
          
          # Strip out potential surrounding literal quotes from bash interpolation
          sed -i '1s/^"//; $s/"$//' temp.patch
          
          git apply temp.patch
          rm temp.patch

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply patch via GitHub Actions Web Interface"
          git push
