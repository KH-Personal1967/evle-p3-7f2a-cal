name: Apply Patch File
on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: 'Paste the entire content of your .patch file here'
        required: true

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Patch
        env:
          PATCH_DATA: ${{ github.event.inputs.patch_content }}
        run: |
          # Write input exactly as-is to a temporary file
          cat << 'EOF' > temp.raw
          $PATCH_DATA
          EOF
          
          # Strip out potential surrounding literal quotes from bash interpolation
          sed -i '1s/^"//; $s/"$//' temp.raw
          
          # Convert web non-breaking spaces (C2 A0 in UTF-8) to standard ASCII spaces
          sed 's/\xca\xa0/ /g' temp.raw > temp.patch

          # Apply the sanitized patch file
          git apply temp.patch
          
          # Clean up temporary files
          rm temp.raw temp.patch

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply patch via GitHub Actions Web Interface"
          git push
